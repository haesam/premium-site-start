name: fetch-images
on:
  push:
    branches: [claude/dental-clinic-homepage-z60nv6]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated images and commit
        run: |
          if [ -f images/clinic-interior.png ]; then echo "images already fetched"; exit 0; fi
          mkdir -p images
          curl -fSL -o images/clinic-interior.png "https://d8j0ntlcm91z4.cloudfront.net/user_2zKID9uGHH3s9RILDyuHqKJaCTk/hf_20260723_092837_c4b51081-1fe5-42ad-ba56-30c8052a1cbc.png"
          curl -fSL -o images/doctor-kim.png "https://d8j0ntlcm91z4.cloudfront.net/user_2zKID9uGHH3s9RILDyuHqKJaCTk/hf_20260723_092840_3b3761f0-af2b-4805-b432-ac7a552d7307.png"
          curl -fSL -o images/doctor-park.png "https://d8j0ntlcm91z4.cloudfront.net/user_2zKID9uGHH3s9RILDyuHqKJaCTk/hf_20260723_092842_f44e1508-fa9c-4348-ba3c-6e4651c719d2.png"
          curl -fSL -o images/doctor-lee.png "https://d8j0ntlcm91z4.cloudfront.net/user_2zKID9uGHH3s9RILDyuHqKJaCTk/hf_20260723_092842_a6a42353-89bf-4eba-93f8-f94158b81e22.png"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Add AI-generated photos (fetched by CI)"
          git push
